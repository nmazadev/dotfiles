# lidm theme: cool teal, taken from the current pywal palette
# (~/.cache/wal/colors.json, wallpaper penrose-triangle-sky). Static copy:
# it does not follow wallpaper changes. Reference: man lidm-config

[colors]
bg = "48;2;10;6;15"
fg = "22;24;38;2;175;219;201"
err = "1;38;2;214;110;120"
s_wayland = "38;2;81;161;146"
s_xorg = "38;2;77;121;133"
s_shell = "38;2;69;138;120"
e_hostname = "38;2;61;161;156"
e_date = "38;2;122;153;140"
e_box = "38;2;51;144;143"
e_header = "4;38;2;81;161;146"
e_user = "38;2;61;161;156"
e_passwd = "4;38;2;175;219;201"
e_badpasswd = "3;4;38;2;214;110;120"
e_key = "38;2;81;161;146"

[chars]
ctl = "╭"
ctr = "╮"
cbl = "╰"
cbr = "╯"

[strings]
opts_pre = "‹ "
opts_post = " ›"

[behavior]
timefmt = "%I:%M %p · %a %d %b"
source = "/etc/lidm.env"
source = "/etc/locale.conf"
user_source = ".lidm.env"
