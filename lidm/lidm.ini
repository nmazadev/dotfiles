# lidm theme. Installed to /etc/lidm.ini by install-extras.sh.
# Reference: man lidm-config
#
# The console only has 16 colours, so the theme names palette slots (30-37, 90-97)
# instead of RGB values, and those slots are loaded with the current pywal colours
# before lidm starts (hypr/scripts/vt-palette.sh + the lidm/theme.conf drop-in).
# No underline/italic: the console doesn't draw them, it recolours the text instead.

[colors]
bg = "40"
# also the reset after every other colour: clears effects without "0" (that would drop bg)
fg = "22;23;24;25;27;37"
err = "91"
s_wayland = "33"
s_xorg = "34"
s_shell = "32"
e_hostname = "93"
e_date = "90"
e_box = "31"
e_header = "90"
e_user = "93"
e_passwd = "37"
e_badpasswd = "91"
e_key = "31"

# box corners: lidm's default square ones (┌┐└┘); the console font
# (Terminus) has no rounded ╭╮╰╯

[strings]
# labels must stay within 9 characters or they spill out of the box
e_user = "user"
e_passwd = "password"
f_poweroff = "sleep tight"
f_reboot = "new day"
opts_pre = "‹ "
opts_post = " ›"

[behavior]
timefmt = "%H:%M · %a %d %b"
source = "/etc/lidm.env"
source = "/etc/locale.conf"
user_source = ".lidm.env"
