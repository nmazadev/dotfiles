# lidm theme: warm and cozy. Installed to /etc/lidm.ini by install-extras.sh.
# Reference: man lidm-config

[colors]
bg = "48;2;28;20;18"
fg = "22;24;38;2;240;228;210"
err = "1;38;2;230;110;110"
s_wayland = "38;2;240;170;110"
s_xorg = "38;2;130;170;200"
s_shell = "38;2;140;180;130"
e_hostname = "38;2;240;170;110"
e_date = "38;2;160;140;125"
e_box = "38;2;196;120;90"
e_header = "4;38;2;240;190;130"
e_user = "38;2;170;200;150"
e_passwd = "4;38;2;240;228;210"
e_badpasswd = "3;4;38;2;230;110;110"
e_key = "38;2;240;170;110"

[chars]
ctl = "╭"
ctr = "╮"
cbl = "╰"
cbr = "╯"

[strings]
e_user = "who goes there"
e_passwd = "secret word"
f_poweroff = "sleep tight"
f_reboot = "new day"
opts_pre = "‹ "
opts_post = " ›"

[behavior]
timefmt = "%I:%M %p · %a %d %b"
source = "/etc/lidm.env"
source = "/etc/locale.conf"
user_source = ".lidm.env"
