# lidm.service drop-in, installed by install-extras.sh (@HOME@ filled in there).
[Service]
# The console font, loaded on tty7 before lidm draws (why: lidm/lidm-console-font)
ExecStartPre=-/usr/local/bin/lidm-console-font 7
# the console's 16 colours = the current pywal palette (hypr/scripts/vt-palette.sh).
# "-": without the file lidm still starts, with the default palette
ExecStartPre=-/usr/bin/setvtrgb @HOME@/.cache/wal/vtrgb
