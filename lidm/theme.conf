# lidm.service drop-in, installed by install-extras.sh (@HOME@ filled in there).
[Service]
# The console font (FONT in /etc/vconsole.conf), loaded before lidm draws. At boot
# the framebuffer console only takes over on the first text written, and
# systemd-vconsole-setup sets the font after that, under lidm's finished screen:
# the console keeps glyph positions, so the box lines turned to garbage. The echo
# triggers the takeover so setfont has a console to work on. ($$ is a literal $)
ExecStartPre=-/bin/sh -c '. /etc/vconsole.conf; [ -n "$$FONT" ] || exit 0; echo > /dev/tty7; setfont -C /dev/tty7 "$$FONT"'
# the console's 16 colours = the current pywal palette (hypr/scripts/vt-palette.sh).
# "-": without the file lidm still starts, with the default palette
ExecStartPre=-/usr/bin/setvtrgb @HOME@/.cache/wal/vtrgb
