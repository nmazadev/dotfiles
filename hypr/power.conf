# Power profiles: what changes when the charger is plugged in or out.
# Read by scripts/power-watch.sh, which applies the matching profile at login and on
# every plug/unplug, and builds hypridle's config from it (template:
# hypridle.template.conf). Edit and save; it takes effect on the next plug/unplug, or
# right away with: ~/.config/hypr/scripts/power-watch.sh apply
#
# Times are in seconds; 0 turns that step off. Levels are in percent.
#   dim         idle time before the screen dims, to dim_level
#   lock        idle time before the lock screen
#   suspend     idle time before the laptop sleeps
#   brightness  brightness set when switching to this profile (empty: leave it)
#   profile     power profile: performance, balanced or power-saver

# plugged in
ac_dim=270
ac_dim_level=10
ac_lock=300
ac_suspend=0
ac_brightness=80
ac_profile=performance

# on battery
bat_dim=120
bat_dim_level=10
bat_lock=180
bat_suspend=600
bat_brightness=40
bat_profile=power-saver
