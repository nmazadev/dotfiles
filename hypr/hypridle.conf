general {
    # one hyprlock at a time, and lock before suspend / lid close
    lock_cmd = pidof hyprlock || hyprlock
    # media-inhibit.sh (music, video, calls) and apps holding an idle inhibitor pause the timers
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# dim the screen a little before locking
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screens off (the Lua config needs hl.dsp.dpms, plain "dpms off" is rejected)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
