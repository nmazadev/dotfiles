general {
    # one hyprlock at a time, and lock before suspend / lid close
    lock_cmd = pidof hyprlock || hyprlock
    # media-inhibit.sh (music, video, calls) and apps holding an idle inhibitor pause the timers
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/screens-on.sh
}

# dim the screen a little before locking
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# No screens-off listener: on this laptop the panel never woke up again after
# dpms off (black screen ignoring keys/mouse), even with screens-on.sh retrying.
# The lock at 5 min still applies.
