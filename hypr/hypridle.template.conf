general {
    # one hyprlock at a time, and lock before suspend / lid close
    lock_cmd = pidof hyprlock || hyprlock
    # media-inhibit.sh (music, video, calls) and apps holding an idle inhibitor pause the timers
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/screens-on.sh
}

# The listeners below are filled in from power.conf by scripts/power-watch.sh, which
# writes the result to ~/.cache/hypridle.conf and (re)starts hypridle with it.
# @NAME@ is replaced with that value; a listener whose time is 0 is left out.

# dim the screen a little before locking
listener {
    timeout = @DIM@
    on-timeout = brightnessctl -s set @DIM_LEVEL@%
    on-resume = brightnessctl -r
}

listener {
    timeout = @LOCK@
    on-timeout = loginctl lock-session
}

# sleep (locks first, through before_sleep_cmd)
listener {
    timeout = @SUSPEND@
    on-timeout = systemctl suspend
}

# No screens-off listener: on this laptop the panel never woke up again after
# dpms off (black screen ignoring keys/mouse), even with screens-on.sh retrying.
